<section id="pi"><div class="w"><div class="eye">Principal investigator</div><h2>Leading the laboratory</h2><div class="pi">${AV("pi","PI")}<div><h3>${T("pi.n")}</h3><p class="mu">${T("pi.b")}</p><div class="cols" style="margin-top:12px"><div><b>Education</b><ul class="k">${LI("pi.e")}</ul>${AD("pi.e","degree")}</div><div><b>Research experience</b><ul class="k">${LI("pi.x")}</ul>${AD("pi.x","position")}</div></div><div style="margin-top:16px"><b>Awards and scholarships</b><ul class="k">${LI("pi.a")}</ul>${AD("pi.a","award")}</div><p class="mu" style="margin-top:14px">${T("pi.m")}<br>${T("pi.s")}</p><p style="margin-top:12px"><a href="${esc(D.ct.s)}" rel="noopener">Google Scholar</a> · <a href="${esc(D.ct.r)}" rel="noopener">ResearchGate</a> · <a href="${esc(D.ct.o)}" rel="noopener">ORCID</a> · <a href="#contact">Contact</a></p></div></div></div></section>
<section id="research" class="alt"><div class="w"><div class="eye">Research areas</div><h2>What we study</h2><p class="lead">Our work connects atomic-scale simulation with the properties that matter for real devices.</p><div class="g">${L("rs",(r,i,p)=>`<div class="c rel"><div class="num">${N(i)}</div><h3>${T(p+".t")}</h3><p>${T(p+".d")}</p>${X(p)}</div>`)}</div>${AD("rs","research area")}</div></section>
<section id="people"><div class="w"><div class="eye">People</div><h2>Our team</h2>${gr.map(g=>`<h3 style="margin-top:28px">${esc(g)}</h3><div class="g">${D.pp.map((p,i)=>p.r===g?PC(i):"").join("")}</div>`).join("")}${AD("pp","person")}</div></section>
<section id="publications" class="alt"><div class="w"><div class="eye">Publications</div><h2>Selected publications</h2><label class="mu">Year: <select id="yr"><option value="">All</option>${ys.map(y=>`<option${y==Y?" selected":""}>${esc(y)}</option>`).join("")}</select></label><div style="margin-top:12px">${D.pb.map((b,i)=>(!Y||ED||b.y==Y)?PB(i):"").join("")}</div>${AD("pb","publication")}<p class="mu" style="margin-top:16px">Full list on <a href="${esc(D.ct.s)}" rel="noopener">Google Scholar</a>.</p></div></section>
<section id="facilities"><div class="w"><div class="eye">Research facilities</div><h2>Computational resources and software</h2><div class="cols"><div><h3>Computing</h3><ul class="k">${LI("fc")}</ul>${AD("fc","resource")}</div><div><h3>Software</h3><div class="chips">${L("sw",(s,i,p)=>`<span class="rel">${T(p)}${X(p)}</span>`)}</div>${AD("sw","software")}</div></div></div></section>
<section id="news" class="alt"><div class="w"><div class="eye">News and updates</div><h2>Latest from the lab</h2>${L("nw",(n,i,p)=>`<div class="news rel"><time>${T(p+".d")}</time><div><b>${T(p+".t")}</b><br><span class="mu">${T(p+".s")}</span></div>${X(p)}</div>`)}${AD("nw","news item")}</div></section>
<section id="opportunities"><div class="w"><div class="eye">Opportunities</div><h2>Join us</h2><div class="g">${L("op",(o,i,p)=>`<div class="c rel"><h3>${T(p+".t")}</h3><p>${T(p+".d")}</p>${X(p)}</div>`)}</div>${AD("op","opportunity")}<div><a class="btn" href="mailto:${esc(D.ct.e)}">Email the lab</a></div></div></section>
<section id="contact" class="alt" style="border-bottom:0"><div class="w"><div class="eye">Contact</div><h2>Get in touch</h2><div class="cols"><div><p class="pl">${T("ct.a")}</p></div><div><p>Email: <a href="mailto:${esc(D.ct.e)}">${T("ct.e")}</a><br>Google Scholar: <a href="${esc(D.ct.s)}" rel="noopener">profile link</a><span class="eo">Scholar URL: ${T("ct.s")}</span><br>ResearchGate: <a href="${esc(D.ct.r)}" rel="noopener">profile link</a><span class="eo">ResearchGate URL: ${T("ct.r")}</span><br>ORCID: <a href="${esc(D.ct.o)}" rel="noopener">profile link</a><span class="eo">ORCID URL: ${T("ct.o")}</span></p></div></div></div></section>`;
if(ED)document.querySelectorAll("#app [data-p]").forEach(e=>e.contentEditable="true");
scrollTo(0,y0);
}
view();
$("#yy").textContent=new Date().getFullYear();
$("#th").onclick=()=>{const r=document.documentElement;const dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dk?"light":"dark"};
if(location.hash){const t=document.getElementById(location.hash.slice(1));t&&t.scrollIntoView()}
const app=$("#app");
app.addEventListener("input",e=>{const t=e.target.closest("[data-p]");if(t&&ED)put(t.dataset.p,t.innerText.trim())});
app.addEventListener("click",e=>{
if(ED&&e.target.closest("a:not(.btn)"))e.preventDefault();
const d=e.target.closest("[data-del]"),a=e.target.closest("[data-add]");
if(d){const k=d.dataset.del.split("."),i=+k.pop();get(k.join(".")).splice(i,1);view()}
if(a){const p=a.dataset.add,n=NEW[p];get(p).push(typeof n==="object"?{...n}:n);view()}
const pd=e.target.closest("[data-phdel]");if(pd){delete get(pd.dataset.phdel).ph;view()}
});
app.addEventListener("change",async e=>{
const t=e.target;
if(t.id==="yr"){Y=t.value;view()}
if(t.dataset.ph&&t.files[0]){
if(!AS){say("Photo upload is only for the site owner or editors");return}
try{say("Uploading photo…");
const bm=await createImageBitmap(t.files[0]),k=Math.min(1,720/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
const bl=await new Promise(r=>c.toBlob(r,"image/jpeg",.86));
const up=await AS.upload(bl);put(t.dataset.ph+".ph",up.id);view();say("Photo added. Press Publish to save.")
}catch(x){say("Photo upload failed ("+(x.code||x.message||"error")+")")}
}});
app.addEventListener("paste",e=>{if(ED){e.preventDefault();document.execCommand("insertText",false,e.clipboardData.getData("text/plain"))}});
app.addEventListener("keydown",e=>{if(ED&&e.key==="Enter"&&!e.target.closest(".pl"))e.preventDefault()});
function build(){
const j=JSON.stringify(D).replace(/</g,"\\u003c");
return `<!DOCTYPE html>\n<html lang="en"><head>${HEAD}<style id="css">${$("#css").textContent}</style></head><body>\n${$("#sh").outerHTML}\n<script id="d" type="application/json">${j}<\/script>\n<script id="js">${$("#js").textContent}<\/script>\n</body></html>`;
}
(async()=>{try{
const u=await claude.use("user"),A=await claude.use("artifact");
if(!u||!A||!((await u.isOwner())||(await u.canEdit())))return;
AS=await claude.use("assets");
const f=document.createElement("div");f.className="fab";document.body.appendChild(f);
const show=()=>{f.innerHTML=ED?`<span id="st">Editing: click any text to change it</span><button class="o" id="cn" type="button">Cancel</button><button id="sv" type="button">Publish</button>`:`<button id="ed" type="button">✎ Edit site</button>`};
show();
f.onclick=async e=>{
const id=e.target.id;
if(id==="ed"){BK=JSON.stringify(D);ED=true;document.body.classList.add("ed");view();show()}
if(id==="cn"){const B=JSON.parse(BK);Object.keys(B).forEach(k=>D[k]=B[k]);ED=false;document.body.classList.remove("ed");view();show()}
if(id==="sv"){const s=$("#st");s.textContent="Publishing…";try{await A.publish(build())}catch(x){s.textContent=x.code==="conflict"?"A newer version exists, reloading…":x.code==="rate_limited"?"Too fast, wait a moment":"Could not publish ("+(x.code||"error")+")"}}
};
}catch(e){}})();
</script>
</body></html>
